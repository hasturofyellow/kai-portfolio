<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai Cinema Hangout</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0e2a47; font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif; color: #12324f; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    #wrap { position: relative; width: 100%; max-width: 960px; margin-top: 12px; }
    canvas { display: block; width: 100%; aspect-ratio: 960 / 600; border-radius: 18px 18px 0 0; border: 4px solid #0a1d33; border-bottom: none; background: #000; touch-action: manipulation; }
    #bar { display: flex; gap: 8px; align-items: center; background: linear-gradient(#3a8fd6, #1f66a8); padding: 8px 10px; border: 4px solid #0a1d33; border-top: none; border-radius: 0 0 18px 18px; flex-wrap: wrap; }
    .btn { background: linear-gradient(#ffffff, #d6e9fa); border: 3px solid #0a1d33; border-radius: 50%; width: 42px; height: 42px; font-size: 20px; cursor: pointer; display: grid; place-items: center; padding: 0; box-shadow: 0 3px 0 #0a1d33; }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a1d33; }
    #chat { flex: 1; min-width: 140px; height: 38px; border-radius: 19px; border: 3px solid #0a1d33; padding: 0 14px; font-size: 15px; font-family: inherit; outline: none; }
    .swatch { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #0a1d33; cursor: pointer; }
    .swatch.on { outline: 3px solid #fff; }
    .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5, 20, 40, 0.55); border-radius: 18px; z-index: 5; }
    .overlay.open { display: flex; }
    .panel { background: #fff; border: 4px solid #0a1d33; border-radius: 22px; padding: 18px 22px; max-width: 460px; width: 90%; box-shadow: 0 8px 0 #0a1d33; }
    .panel h2 { margin: 0 0 8px; font-size: 22px; color: #1f66a8; }
    .panel p { margin: 0 0 14px; font-size: 16px; line-height: 1.4; }
    .pbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .pbtn { background: linear-gradient(#ffd84d, #f2a900); border: 3px solid #0a1d33; border-radius: 14px; padding: 7px 16px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; color: #0a1d33; }
    .pbtn.alt { background: linear-gradient(#ffffff, #d6e9fa); }
    #mapGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    #mapGrid button { height: 70px; border-radius: 16px; border: 3px solid #0a1d33; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; text-shadow: 0 2px 0 #0a1d33; }
    #gameBox { width: 94%; height: 90%; background: #000; border: 4px solid #0a1d33; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    #gameHead { background: #1f66a8; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-weight: bold; }
    #gameFrame { flex: 1; border: 0; width: 100%; background: #fff; }
    #hint { margin: 8px 0 16px; color: #9cc3e6; font-size: 13px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<div id="wrap">
    <canvas id="c" width="960" height="600"></canvas>
    <div id="bar">
        <button class="btn" id="mapBtn" title="Map">🗺️</button>
        <button class="btn emote" data-e="😀" title="Emote">😀</button>
        <button class="btn emote" data-e="❤️" title="Emote">❤️</button>
        <button class="btn emote" data-e="🍿" title="Emote">🍿</button>
        <button class="btn emote" data-e="🎬" title="Emote">🎬</button>
        <input id="chat" maxlength="60" placeholder="Click here to chat, Enter to say it">
        <div id="swatches" style="display:flex;gap:5px"></div>
    </div>

    <div class="overlay" id="dialog"><div class="panel">
        <h2 id="dlgName"></h2><p id="dlgText"></p><div class="pbtns" id="dlgBtns"></div>
    </div></div>

    <div class="overlay" id="map"><div class="panel">
        <h2>Cinema Map</h2>
        <div id="mapGrid"></div>
        <div class="pbtns"><button class="pbtn alt" id="mapClose">Close</button></div>
    </div></div>

    <div class="overlay" id="gameModal"><div id="gameBox">
        <div id="gameHead"><span id="gameTitle"></span><button class="pbtn alt" id="gameClose">✕ Leave screen</button></div>
        <iframe id="gameFrame" title="Now playing"></iframe>
    </div></div>
</div>
<div id="hint">Click the floor to walk · Click doors, people and objects to interact · Demo of the cinema as a 2D room-based hangout</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 600;

// ---------- state ----------
const state = {
    coins: 15, ticket: false, popcorn: false,
    strangerFed: false, bills: new Set(), fellInLava: false,
    quest: 0, questActive: false,
};

const COLORS = ['#3a8fd6', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#ff7eb6', '#1abc9c', '#34495e'];

function makeBuddy(name, color, x, y, opts = {}) {
    return { name, color, x, y, tx: x, ty: y, dir: 1, phase: 0, moving: false,
        hat: opts.hat || null, wander: !!opts.wander, lines: opts.lines || [],
        sit: !!opts.sit, say: '', sayT: 0, nextWander: Math.random() * 3, nextLine: 4 + Math.random() * 6,
        onClick: opts.onClick || null, sink: 0 };
}

const player = makeBuddy('You', '#3a8fd6', 480, 450, { hat: 'beanie' });
let pendingAction = null;

// ---------- helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(rx, 0.1), Math.max(ry, 0.1), 0, 0, Math.PI * 2); }
function fillStroke(fill, stroke = '#0a1d33', lw = 3) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v + amt)));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function inPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi, yi] = poly[i], [xj, yj] = poly[j];
        if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
}
function text(str, x, y, size, color = '#fff', align = 'center', stroke = '#0a1d33') {
    ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function scaleAt(room, y) { return 0.62 + 0.5 * (y - room.floorTop) / (H - room.floorTop); }
function say(b, msg, secs = 4) { b.say = msg; b.sayT = secs; }

let toastMsg = '', toastT = 0;
function toast(msg) { toastMsg = msg; toastT = 3; }

// ---------- buddy drawing (original round "puffball" avatars) ----------
function drawBuddy(b, room) {
    const s = scaleAt(room, b.y) * (b.sit ? 0.95 : 1);
    const bob = b.moving ? Math.abs(Math.sin(b.phase)) * 5 * s : 0;
    const x = b.x, y = b.y + b.sink * 60 * s;
    ctx.save();
    if (b.sink > 0) { ctx.beginPath(); ctx.rect(x - 60 * s, 0, 120 * s, b.y + 2); ctx.clip(); }
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ell(b.x, b.y, 28 * s, 8 * s); ctx.fill();
    // feet
    const step = b.moving ? Math.sin(b.phase) * 5 * s : 0;
    ell(x - 11 * s, y - 3 * s - Math.max(0, step), 10 * s, 6 * s); fillStroke(shade(b.color, -50), '#0a1d33', 2.5);
    ell(x + 11 * s, y - 3 * s - Math.max(0, -step), 10 * s, 6 * s); fillStroke(shade(b.color, -50), '#0a1d33', 2.5);
    const cy = y - 36 * s - bob;
    // ears
    ell(x - 17 * s, cy - 30 * s, 9 * s, 9 * s); fillStroke(b.color);
    ell(x + 17 * s, cy - 30 * s, 9 * s, 9 * s); fillStroke(b.color);
    ell(x - 17 * s, cy - 30 * s, 4.5 * s, 4.5 * s); ctx.fillStyle = '#ffc7d9'; ctx.fill();
    ell(x + 17 * s, cy - 30 * s, 4.5 * s, 4.5 * s); ctx.fill();
    // arms
    const wave = b.moving ? Math.sin(b.phase) * 0.4 : 0;
    ctx.save(); ctx.translate(x - 26 * s, cy + 2 * s); ctx.rotate(0.5 + wave); ell(0, 6 * s, 7 * s, 12 * s); fillStroke(b.color); ctx.restore();
    ctx.save(); ctx.translate(x + 26 * s, cy + 2 * s); ctx.rotate(-0.5 - wave); ell(0, 6 * s, 7 * s, 12 * s); fillStroke(b.color); ctx.restore();
    // body
    ell(x, cy, 29 * s, 34 * s); fillStroke(b.color);
    ell(x + b.dir * 3 * s, cy + 9 * s, 17 * s, 18 * s); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
    // face
    const fx = x + b.dir * 5 * s, fy = cy - 12 * s;
    ell(fx - 9 * s, fy, 6.5 * s, 7.5 * s); fillStroke('#fff', '#0a1d33', 2);
    ell(fx + 9 * s, fy, 6.5 * s, 7.5 * s); fillStroke('#fff', '#0a1d33', 2);
    ctx.fillStyle = '#0a1d33';
    ell(fx - 8 * s + b.dir * 2 * s, fy + 1 * s, 3.2 * s, 3.8 * s); ctx.fill();
    ell(fx + 10 * s + b.dir * 2 * s, fy + 1 * s, 3.2 * s, 3.8 * s); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,150,0.55)';
    ell(fx - 16 * s, fy + 9 * s, 5 * s, 3 * s); ctx.fill(); ell(fx + 16 * s, fy + 9 * s, 5 * s, 3 * s); ctx.fill();
    ctx.beginPath(); ctx.arc(fx, fy + 8 * s, 4 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.lineWidth = 2; ctx.strokeStyle = '#0a1d33'; ctx.stroke();
    drawHat(b.hat, x, cy - 30 * s, s);
    ctx.restore();
    if (b.sink === 0) text(b.name, x, b.y + 14 * s, 13 * s + 2, '#fff');
}

function drawHat(hat, x, y, s) {
    if (hat === 'beanie') {
        ctx.beginPath(); ctx.arc(x, y + 6 * s, 22 * s, Math.PI, 0); ctx.closePath(); fillStroke('#ffd84d');
        rr(x - 24 * s, y + 2 * s, 48 * s, 9 * s, 4 * s); fillStroke('#f2a900');
        ell(x, y - 17 * s, 6 * s, 6 * s); fillStroke('#fff');
    } else if (hat === 'cap') {
        rr(x - 20 * s, y - 12 * s, 40 * s, 18 * s, 6 * s); fillStroke('#1b2c6b');
        rr(x - 24 * s, y + 3 * s, 48 * s, 6 * s, 3 * s); fillStroke('#0f1a40');
        ell(x, y - 3 * s, 5 * s, 5 * s); fillStroke('#ffd84d', '#0a1d33', 1.5);
    } else if (hat === 'veil') {
        ctx.beginPath(); ctx.moveTo(x - 30 * s, y + 30 * s); ctx.quadraticCurveTo(x, y - 40 * s, x + 30 * s, y + 30 * s); ctx.closePath();
        ctx.fillStyle = 'rgba(40,10,60,0.55)'; ctx.fill(); ctx.strokeStyle = '#0a1d33'; ctx.lineWidth = 2; ctx.stroke();
    } else if (hat === 'tophat') {
        rr(x - 24 * s, y + 2 * s, 48 * s, 7 * s, 3 * s); fillStroke('#222');
        rr(x - 15 * s, y - 26 * s, 30 * s, 30 * s, 3 * s); fillStroke('#222');
        ctx.fillStyle = '#c0392b'; ctx.fillRect(x - 15 * s, y - 4 * s, 30 * s, 5 * s);
    }
}

function drawBubble(b, room) {
    if (!b.say || b.sink > 0) return;
    const s = scaleAt(room, b.y);
    ctx.font = 'bold 15px "Trebuchet MS", Arial, sans-serif';
    const words = b.say.split(' '); const lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > 200 && cur) { lines.push(cur); cur = w; } else cur = t; }
    lines.push(cur);
    const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 24, bh = lines.length * 19 + 14;
    const bx = Math.min(W - bw - 6, Math.max(6, b.x - bw / 2)), by = b.y - 110 * s - bh;
    ctx.globalAlpha = Math.min(1, b.sayT * 2);
    rr(bx, by, bw, bh, 12); fillStroke('#fff', '#0a1d33', 3);
    ctx.beginPath(); ctx.moveTo(b.x - 8, by + bh - 1.5); ctx.lineTo(b.x, by + bh + 12); ctx.lineTo(b.x + 8, by + bh - 1.5);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#0a1d33'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillRect(b.x - 7, by + bh - 4, 14, 4);
    lines.forEach((l, i) => text(l, bx + bw / 2, by + 16 + i * 19, 15, '#0a1d33', 'center', null));
    ctx.globalAlpha = 1;
}

// ---------- shared props ----------
function drawBill(x, y, t) {
    const g = Math.sin(t * 4 + x) * 0.5 + 0.5;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.25);
    rr(-14, -7, 28, 14, 3); fillStroke('#5fbf5f', '#1e5e1e', 2);
    text('$5', 0, 0, 10, '#1e5e1e', 'center', null);
    ctx.restore();
    ctx.fillStyle = `rgba(255,255,200,${0.25 * g})`; ell(x, y, 22, 14); ctx.fill();
}

// ---------- rooms ----------
const rooms = {};

rooms.street = {
    title: 'Main Street', floorTop: 360, color: '#3a8fd6',
    poly: [[20, 372], [940, 372], [940, 515], [20, 515]],
    entries: { default: [480, 440], lobby: [480, 400], cave: [800, 430] },
    drawBg(t) {
        const g = ctx.createLinearGradient(0, 0, 0, 360); g.addColorStop(0, '#5cb6f0'); g.addColorStop(1, '#c9ecff');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, 360);
        for (let i = 0; i < 4; i++) {
            const cx = ((t * 12 + i * 280) % 1200) - 120, cy = 50 + (i % 2) * 40;
            ctx.fillStyle = '#fff'; ell(cx, cy, 50, 18); ctx.fill(); ell(cx + 30, cy - 10, 30, 18); ctx.fill(); ell(cx - 28, cy - 4, 26, 14); ctx.fill();
        }
        rr(-10, 150, 170, 220, 0); fillStroke('#8fa7c4'); rr(800, 120, 180, 250, 0); fillStroke('#a4b6cc');
        for (let r = 0; r < 4; r++) for (let k = 0; k < 3; k++) { rr(15 + k * 48, 170 + r * 46, 30, 28, 4); fillStroke(r % 2 ? '#ffe9a6' : '#d9eefc', '#0a1d33', 2); }
        for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++) { rr(820 + k * 48, 140 + r * 44, 30, 28, 4); fillStroke((r + k) % 3 ? '#d9eefc' : '#ffe9a6', '#0a1d33', 2); }
        // cinema facade
        rr(160, 40, 640, 335, [26, 26, 0, 0]); fillStroke('#c0392b');
        rr(185, 20, 590, 40, 18); fillStroke('#8e2a20');
        rr(215, 92, 530, 82, 14); fillStroke('#1d1530');
        for (let i = 0; i < 26; i++) {
            const on = (Math.floor(t * 6) + i) % 3 !== 0;
            ctx.fillStyle = on ? '#ffe066' : '#7a6420';
            ell(228 + i * 20.2, 98, 4, 4); ctx.fill(); ell(228 + i * 20.2, 168, 4, 4); ctx.fill();
        }
        text('KAI CINEMA', 480, 134, 46, '#ffd84d');
        text('NOW SHOWING: 4 GAMES', 480, 196, 16, '#fff');
        // posters
        [[195, 'SNAKE', '#2ecc71'], [655, 'SOCCER', '#3a8fd6']].forEach(([px, label, col]) => {
            rr(px, 222, 110, 130, 8); fillStroke('#ffd84d');
            rr(px + 8, 230, 94, 114, 6); fillStroke(col, '#0a1d33', 2);
            text(label, px + 55, 330, 16, '#fff');
            ell(px + 55, 280, 26, 26); fillStroke('#fff', '#0a1d33', 2);
            text('▶', px + 57, 281, 22, col, 'center', null);
        });
        // doors
        rr(410, 232, 140, 143, [12, 12, 0, 0]); fillStroke('#5a1a12');
        rr(420, 242, 58, 133, 6); fillStroke('#bfe4ff'); rr(482, 242, 58, 133, 6); fillStroke('#bfe4ff');
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(430, 252, 8, 90); ctx.fillRect(492, 252, 8, 90);
        ctx.fillStyle = '#ffd84d'; ctx.fillRect(468, 300, 6, 22); ctx.fillRect(486, 300, 6, 22);
        // sidewalk + road
        ctx.fillStyle = '#e3d5bd'; ctx.fillRect(0, 360, W, 160);
        ctx.strokeStyle = 'rgba(10,29,51,0.15)'; ctx.lineWidth = 2;
        for (let x = 0; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 360); ctx.lineTo(x - 40, 520); ctx.stroke(); }
        ctx.beginPath(); ctx.moveTo(0, 440); ctx.lineTo(W, 440); ctx.stroke();
        rr(410, 372, 140, 34, 10); fillStroke('#b8323a', '#0a1d33', 2);
        ctx.fillStyle = '#9aa3ad'; ctx.fillRect(0, 515, W, 12);
        ctx.fillStyle = '#4b525a'; ctx.fillRect(0, 527, W, 73);
        ctx.fillStyle = '#ffd84d'; for (let x = (-t * 40) % 90; x < W; x += 90) ctx.fillRect(x, 560, 50, 7);
    },
    props: [
        { y: 425, draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ell(120, 425, 26, 7); ctx.fill();
            rr(114, 230, 12, 195, 4); fillStroke('#2c3e50');
            ell(120, 222, 22, 18); fillStroke('#ffe066');
        } },
        { y: 405, draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.25)'; ell(870, 405, 80, 10); ctx.fill();
            rr(800, 330, 140, 75, 8); fillStroke('#27ae60');
            rr(792, 318, 156, 18, 6); fillStroke('#1e8449');
            ctx.strokeStyle = 'rgba(10,29,51,0.35)'; ctx.lineWidth = 3;
            for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(820 + k * 32, 345); ctx.lineTo(820 + k * 32, 395); ctx.stroke(); }
            text('NOT A DUMPSTER?', 870, 370, 11, '#fff');
        } },
    ],
    hotspots: [
        { x: 410, y: 232, w: 140, h: 143, label: 'Enter the cinema', walkTo: [480, 392], act: () => goRoom('lobby', 'street') },
        { x: 792, y: 318, w: 156, h: 87, label: 'Climb into the dumpster', walkTo: [820, 420], act: () => goRoom('cave', 'street') },
        { x: 905, y: 450, w: 30, h: 20, bill: 'street', label: 'Something green...', walkTo: [890, 470], act: () => grabBill('street') },
    ],
    npcs: [],
};

rooms.lobby = {
    title: 'Lobby', floorTop: 335, color: '#9b59b6',
    poly: [[312, 345], [940, 345], [940, 588], [20, 588], [20, 400], [312, 400]],
    entries: { default: [480, 470], street: [480, 545], theater: [480, 370] },
    drawBg(t) {
        ctx.fillStyle = '#6b3fa0'; ctx.fillRect(0, 0, W, 340);
        ctx.fillStyle = 'rgba(255,255,255,0.06)'; for (let x = 0; x < W; x += 60) ctx.fillRect(x, 0, 30, 340);
        ctx.fillStyle = '#4a2a75'; ctx.fillRect(0, 320, W, 20);
        // carpet
        ctx.fillStyle = '#b8323a'; ctx.fillRect(0, 340, W, 260);
        ctx.fillStyle = 'rgba(255,216,77,0.18)';
        for (let r = 0; r < 6; r++) for (let k = -1; k < 13; k++) {
            const cx = k * 80 + (r % 2) * 40, cy = 360 + r * 46;
            ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 14, cy); ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 14, cy); ctx.fill();
        }
        // theater doors
        rr(405, 175, 150, 160, [70, 70, 0, 0]); fillStroke('#2b1640');
        rr(420, 190, 120, 145, [60, 60, 0, 0]); fillStroke('#1d1530');
        const glow = 0.5 + 0.5 * Math.sin(t * 3);
        rr(400, 120, 160, 40, 12); fillStroke('#1d1530');
        text('SCREENS ▲', 480, 141, 20, `rgb(255,${200 + glow * 55},${80 + glow * 80})`);
        // menu board
        rr(40, 60, 250, 120, 10); fillStroke('#1d1530');
        text('SNACKS', 165, 85, 20, '#ffd84d');
        text('🍿 Popcorn ..... 3c', 165, 118, 15, '#fff', 'center', null);
        text('🥤 Soda .......  soon', 165, 146, 15, '#999', 'center', null);
        // ticket booth with Iris
        rr(640, 140, 210, 200, [20, 20, 0, 0]); fillStroke('#c9a227');
        rr(658, 180, 174, 110, 10); fillStroke('#20103a');
        const iris = { name: '', color: '#d9c7ef', x: 745, y: 300, dir: -1, phase: 0, moving: false, hat: 'veil', sink: 0, sit: false };
        ctx.save(); rr(658, 180, 174, 110, 10); ctx.clip(); drawBuddy(iris, { floorTop: 0 }); ctx.restore();
        ctx.fillStyle = 'rgba(180,220,255,0.18)'; rr(658, 180, 174, 110, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(670, 188, 10, 90);
        rr(650, 150, 190, 26, 8); fillStroke('#1d1530');
        text('TICKETS · IRIS', 745, 163, 14, '#ffd84d');
        rr(640, 290, 210, 50, 0); fillStroke('#a8861c');
        // exit mat
        rr(400, 560, 160, 30, 10); fillStroke('#2c3e50', '#0a1d33', 2);
        text('▼ EXIT', 480, 575, 14, '#fff', 'center', null);
    },
    props: [
        { y: 400, draw(t) {
            rr(20, 285, 290, 115, 10); fillStroke('#e6e6e6');
            rr(20, 270, 290, 22, 8); fillStroke('#c0392b');
            for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#c0392b' : '#fff'; ctx.fillRect(30 + k * 46, 300, 46, 90); }
            ctx.strokeStyle = '#0a1d33'; ctx.lineWidth = 3; ctx.strokeRect(20, 292, 290, 108);

function buyPopcorn() {
    if (state.popcorn) return say(player, 'I already have popcorn!');
    if (state.coins < 3) return say(player, 'Not enough coins... (3c)');
    state.coins -= 3; state.popcorn = true; say(player, 'Got popcorn! 🍿');
}

function playArcade() {
    if (state.coins < 2) return say(player, 'Arcade costs 2 coins.');
    state.coins -= 2;
    const roll = Math.random();
    const win = roll < 0.15 ? 10 : roll < 0.5 ? 4 : 0;
    state.coins += win;
    say(player, win ? `Arcade paid out ${win} coins!` : 'Lost 2 coins. Rigged!');
}

        showDialog('Iris', q.ask, btns.concat({ label: 'I\'ll do it', fn: () => { state.questActive = true; closeDialog(); toast(`New task: ${q.title}`); } }, { label: 'Later', fn: closeDialog, alt: true }));

// ---------- input ----------
let mouse = { x: -1, y: -1 }, hover = null;
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function hitHotspot(p) {
    for (const h of room.hotspots) {
        if (h.bill && state.bills.has(h.bill)) continue;
        if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h;
    }
    for (const n of room.npcs) if (n.onClick && Math.hypot(p.x - n.x, p.y - (n.y - 40)) < 40)
        return { label: `Talk to ${n.name}`, walkTo: [n.x - 70, n.y + 20], act: n.onClick };
    return null;
}
function clampWalk(x, y) {
    if (inPoly(x, y, room.poly)) return [x, y];
    for (let t = 1; t >= 0; t -= 0.02) { const px = player.x + (x - player.x) * t, py = player.y + (y - player.y) * t; if (inPoly(px, py, room.poly)) return [px, py]; }
    return [player.x, player.y];
}
cv.addEventListener('mousemove', e => { mouse = toCanvas(e); hover = hitHotspot(mouse); cv.style.cursor = hover ? 'pointer' : 'default'; });
cv.addEventListener('mouseleave', () => { hover = null; mouse = { x: -1, y: -1 }; });
cv.addEventListener('click', e => {
    if (anyOverlay() || fadeTo || player.sink > 0) return;
    const p = toCanvas(e); const h = hitHotspot(p);
    if (h) { [player.tx, player.ty] = clampWalk(h.walkTo[0], h.walkTo[1]); pendingAction = h.act; }
    else { [player.tx, player.ty] = clampWalk(p.x, p.y); pendingAction = null; }
});

// ---------- update ----------
function moveBuddy(b, dt) {
    const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
    const sp = 230 * scaleAt(room, b.y) * dt;
    if (d > 2) { b.moving = true; b.x += dx / d * Math.min(sp, d); b.y += dy / d * Math.min(sp, d); if (Math.abs(dx) > 1) b.dir = dx > 0 ? 1 : -1; b.phase += dt * 12; }
    else { b.moving = false; b.phase = 0; }
    if (b.sayT > 0) { b.sayT -= dt; if (b.sayT <= 0) b.say = ''; }
    return d <= 2;
}

function update(dt) {
    if (fadeTo) { fade -= dt * 4; if (fade <= 0) { fade = 0; fadeTo(); fadeTo = null; } }
    else if (fade < 1) fade = Math.min(1, fade + dt * 4);

    if (player.sink > 0) {
        player.sink += dt * 0.8;
        if (player.sink >= 1) {
            player.sink = 0; state.fellInLava = true;
            const e = room.entries.default; player.x = player.tx = e[0]; player.y = player.ty = e[1];
            say(player, 'OUCH. That was hot.');
        }
        if (player.sayT > 0) player.sayT -= dt;
    } else {
        const arrived = moveBuddy(player, dt);
        if (arrived && pendingAction) { const a = pendingAction; pendingAction = null; a(); }
        if (room === rooms.cave) {
            const nx = (player.x - LAVA.x) / (LAVA.rx - 15), ny = (player.y - LAVA.y) / (LAVA.ry - 8);
            if (nx * nx + ny * ny < 1) { player.sink = 0.01; player.tx = player.x; player.ty = player.y; pendingAction = null; say(player, 'AAAAH!', 2); }
        }
    }
    for (const n of room.npcs) {
        moveBuddy(n, dt);
        if (n.wander && (n.nextWander -= dt) <= 0) {
            n.nextWander = 2 + Math.random() * 4;
            for (let k = 0; k < 10; k++) { const x = 40 + Math.random() * 880, y = room.floorTop + 20 + Math.random() * (H - room.floorTop - 40); if (inPoly(x, y, room.poly)) { n.tx = x; n.ty = y; break; } }
        }
        if (n.lines.length && (n.nextLine -= dt) <= 0) { n.nextLine = 6 + Math.random() * 8; say(n, n.lines[Math.floor(Math.random() * n.lines.length)]); }
    }
    if (toastT > 0) toastT -= dt;
}

    text(state.ticket ? '🎟️' : '', 120, 34, 22, '#000', 'center', null);
    text(state.popcorn ? '🍿' : '', 150, 34, 22, '#000', 'center', null);
    text(room.title, 298, 34, 14, '#1f66a8', 'right', null);
    const q = QUESTS[state.quest];
    if (q && state.questActive) {
        const label = `${q.done() ? '✔ Return to Iris' : q.goal}${q.progress && !q.done() ? ' ' + q.progress() : ''}`;
        ctx.font = 'bold 14px "Trebuchet MS", Arial'; const w = Math.max(ctx.measureText(label).width, ctx.measureText(q.title).width) + 30;
        rr(W - w - 12, 12, w, 52, 14); fillStroke('rgba(29,21,48,0.88)', '#c9a227', 2.5);
        text(q.title, W - w / 2 - 12, 28, 13, '#ffd84d', 'center', null);
        text(label, W - w / 2 - 12, 48, 14, '#fff', 'center', null);
    }
    if (hover && mouse.x >= 0) {
        ctx.font = 'bold 14px "Trebuchet MS", Arial'; const w = ctx.measureText(hover.label).width + 20;
        const x = Math.min(W - w - 4, mouse.x + 14), y = Math.max(4, mouse.y - 34);
        rr(x, y, w, 26, 10); fillStroke('#fff', '#0a1d33', 2.5);
        text(hover.label, x + w / 2, y + 13, 14, '#0a1d33', 'center', null);
    }
    if (toastT > 0) {
        ctx.globalAlpha = Math.min(1, toastT * 2);
        ctx.font = 'bold 20px "Trebuchet MS", Arial'; const w = ctx.measureText(toastMsg).width + 40;
        rr(W / 2 - w / 2, 70, w, 40, 20); fillStroke('#ffd84d');
        text(toastMsg, W / 2, 90, 20, '#0a1d33', 'center', null);
        ctx.globalAlpha = 1;
    }
}

function render(t) {
    ctx.clearRect(0, 0, W, H);
    room.drawBg(t);
    for (const h of room.hotspots) if (h.bill && !state.bills.has(h.bill)) drawBill(h.x + h.w / 2, h.y + h.h / 2, t);
    const list = room.props.map(p => ({ y: p.y, draw: () => p.draw(t) }))
        .concat([player, ...room.npcs].map(b => ({ y: b.y, draw: () => drawBuddy(b, room) })));
    list.sort((a, b) => a.y - b.y).forEach(o => o.draw());
    if (room === rooms.cave) { ctx.fillStyle = `rgba(255,90,0,${0.06 + 0.03 * Math.sin(t * 3)})`; ctx.fillRect(0, 0, W, H); }
    [player, ...room.npcs].forEach(b => drawBubble(b, room));
    drawHud();
    if (fade < 1) { ctx.fillStyle = `rgba(10,29,51,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); render(now / 1000);
    requestAnimationFrame(loop);
}
toast('Welcome to Kai Cinema!');
say(player, 'Click to walk around!', 5);
requestAnimationFrame(loop);
</script>
</body>
</html>
