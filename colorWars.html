<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chain Reaction — Multiplayer</title>
  <style>
    :root{
      --bg:#0f1724;
      --panel:#0b1220;
      --card:#0e2338;
      --text:#e6eef8;
      --cell-size:72px;
      --p1:#5cc3ff; /* blue */
      --p2:#ff5c5c; /* red */
      --p3:#9b5cff;
      --p4:#5cff8b;
      --p5:#ffd65c;
      --p6:#ff5ccd;
      --p7:#5cfff0;
      --p8:#ffffff;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial; background:linear-gradient(180deg,#071021 0%, #0b1830 100%); color:var(--text);}
    .wrap{max-width:980px;margin:28px auto;padding:20px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.05));box-shadow:0 8px 30px rgba(2,6,23,0.7)}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{margin:0;font-size:20px}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button, select, input{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px}
    .board-area{display:flex;gap:20px;margin-top:18px;align-items:flex-start}
    .board{display:grid; padding:10px;border-radius:8px; background:rgba(255,255,255,0.02)}
    .cell{width:var(--cell-size);height:var(--cell-size);display:flex;align-items:center;justify-content:center;position:relative;border-radius:6px;margin:6px;background:rgba(255,255,255,0.03)}
    .orbs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
    .orb{width:18px;height:18px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15)}
    .count{position:absolute;left:6px;top:6px;font-size:12px;color:rgba(255,255,255,0.9)}
    .status{min-width:220px;padding:12px;border-radius:8px;background:rgba(255,255,255,0.03)}
    .player-indicator{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .badge{width:14px;height:14px;border-radius:50%}
    .small{font-size:13px;color:rgba(255,255,255,0.7)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Chain Reaction — Multiplayer</h1>
      <div class="controls">
        <label>Rows <input id="rows" type="number" min="3" max="9" value="5" style="width:60px"></label>
        <label>Cols <input id="cols" type="number" min="3" max="9" value="5" style="width:60px"></label>

        <label>Players
          <select id="players">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
          </select>
        </label>

        <button id="newBtn">New Game</button>
        <button id="resetBtn">Reset</button>
      </div>
    </header>

    <div class="board-area">
      <div id="board" class="board"></div>

      <div class="status">
        <div class="player-indicator">
          <div id="turnBadge" class="badge"></div>
          <div id="turnText"></div>
        </div>
        <div class="log" id="log">Click a cell you own or (only on the very first move) an empty cell.</div>
        <div style="height:8px"></div>
        <div class="small">Note: only the first move of the whole game may be placed on an empty cell. After that, place only on your own cells.</div>
      </div>
    </div>
  </div>

<script>
(function(){
  const CRITICAL = 4;
  let rows = 5, cols = 5, numPlayers = 2;

  const palette = [
    { var:"p1", name:"Blue" },
    { var:"p2", name:"Red" },
    { var:"p3", name:"Purple" },
    { var:"p4", name:"Green" },
    { var:"p5", name:"Yellow" },
    { var:"p6", name:"Pink" },
    { var:"p7", name:"Cyan" },
    { var:"p8", name:"White" }
  ];

  let state = {
    grid: [],
    turn: 0,
    alive: [],
    players: [],
    hasPlayed: [],
    firstMoveDone: false,
    gameOver: false
  };

  const boardEl = document.getElementById("board");
  const logEl = document.getElementById("log");
  const turnText = document.getElementById("turnText");
  const turnBadge = document.getElementById("turnBadge");

  // Build players according to selected number
  function generatePlayers(){
    numPlayers = parseInt(document.getElementById("players").value);
    state.players = palette.slice(0, numPlayers);
  }

  // New game (rebuild players + board)
  function newGame(){
    generatePlayers();
    createBoard(true);
  }

  // Reset board only, keep players
  function resetGame(){
    createBoard(false);
  }

  // Create board and initialize state
  function createBoard(freshPlayers){
    rows = parseInt(document.getElementById("rows").value) || 5;
    cols = parseInt(document.getElementById("cols").value) || 5;

    if(freshPlayers) generatePlayers();
    numPlayers = state.players.length;

    state.grid = Array.from({length:rows}, ()=> Array.from({length:cols}, ()=> ({count:0, color:null})));
    state.turn = 0;
    state.alive = Array(numPlayers).fill(true);
    state.hasPlayed = Array(numPlayers).fill(false);
    state.firstMoveDone = false;
    state.gameOver = false;

    boardEl.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    render();
    updateUI();
    log("New game started — players: " + state.players.map(p => p.name).join(", "));
  }

  // Render grid
  function render(){
    boardEl.innerHTML = "";
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const cell = state.grid[r][c];
        const el = document.createElement("div");
        el.className = "cell";
        el.onclick = ()=> clickCell(r,c);

        const count = document.createElement("div");
        count.className = "count";
        count.textContent = cell.count || "";
        el.appendChild(count);

        const orbs = document.createElement("div");
        orbs.className = "orbs";
        for(let i=0;i<Math.min(cell.count,4);i++){
          const o = document.createElement("div");
          o.className = "orb";
          if(cell.color){
            const cssColor = getComputedStyle(document.documentElement).getPropertyValue(`--${cell.color}`).trim();
            o.style.background = cssColor;  // orb color
            el.style.backgroundColor = cssColor + "33"; // safe light tint
            } else {
            el.style.backgroundColor = "rgba(255,255,255,0.03)"; // default
            }

          orbs.appendChild(o);
        }
        el.appendChild(orbs);
        boardEl.appendChild(el);
        // existing code inside render(), after creating `el`
        if(cell.color){
        const cssColor = getComputedStyle(document.documentElement).getPropertyValue(`--${cell.color}`).trim();
        o.style.background = cssColor;  // existing orb color
        // New: tint cell background lightly
        el.style.backgroundColor = cssColor + "33"; // '33' = ~20% opacity
        } else {
        el.style.backgroundColor = "rgba(255,255,255,0.03)"; // default
        }

      }
    }
  }

  // Click handler with the new "first move only" rule
  function clickCell(r, c){
    if(state.gameOver){
      log("Game over — start a new game.");
      return;
    }

    const cell = state.grid[r][c];
    const player = state.players[state.turn];
    const playerColor = player.var;

    // Allow: if it's the very first move of the whole game, placing on empty squares is allowed.
    // After that, players can place only on cells they already own.
    const canPlace =
    // Player has never placed before, can pick an empty cell
    (!state.hasPlayed[state.turn] && cell.count === 0) ||
    // Or player already owns the cell
    (cell.color === playerColor);

    if(!canPlace){
      log("You can only place on your own cells.");
      return;
    }

    // Mark that this player has played at least once
    state.hasPlayed[state.turn] = true;

    // Place orb
    cell.count++;
    cell.color = playerColor;

    // Because the very first move was just used, mark it done.
    if(!state.firstMoveDone) state.firstMoveDone = true;

    // Resolve explosions and consequences
    stabilize();
    render();

    // Evaluate eliminations and winner
    checkEliminations();
    checkWinner();

    // If game not over, advance to next alive player
    if(!state.gameOver){
      nextTurn();
      updateUI();
    }
  }

  // Stabilize board: iterate until no cells >= CRITICAL
  function stabilize(){
    let changed = true;
    while(changed){
      changed = false;
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          const cell = state.grid[r][c];
          if(cell.count >= CRITICAL){
            changed = true;
            const color = cell.color;
            cell.count -= CRITICAL;
            if(cell.count === 0) cell.color = null;
            const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
            for(const [dr,dc] of dirs){
              const nr = r + dr, nc = c + dc;
              if(nr >= 0 && nr < rows && nc >= 0 && nc < cols){
                const n = state.grid[nr][nc];
                n.count++;
                // receiver converts to exploding color
                n.color = color;
              }
            }
          }
        }
      }
    }
  }

  // Mark players eliminated only if they have played and now have zero orbs
  function checkEliminations(){
    const counts = Array(numPlayers).fill(0);
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const cell = state.grid[r][c];
        if(cell.color){
          const idx = state.players.findIndex(p=>p.var === cell.color);
          if(idx >= 0) counts[idx] += cell.count;
        }
      }
    }
    for(let i=0;i<numPlayers;i++){
      if(state.hasPlayed[i] && counts[i] === 0){
        state.alive[i] = false;
      }
    }
  }

  // Advance to next alive player (safeguarded)
  function nextTurn(){
    if(state.gameOver) return;
    let attempts = 0;
    do {
      state.turn = (state.turn + 1) % numPlayers;
      attempts++;
      if(attempts > numPlayers + 2) break; // safety net
    } while(!state.alive[state.turn]);
  }

  // Check if only one player remains
  function checkWinner(){
    const survivors = state.alive.map((a,i)=>a?i:null).filter(x=>x!==null);
    if(survivors.length === 1){
      const w = state.players[survivors[0]];
      state.gameOver = true;
      log(`${w.name} wins!`);
      alert(`${w.name} wins!`);
    }
  }

  // Update turn badge and text
  function updateUI(){
    const p = state.players[state.turn];
    turnText.textContent = `${p.name}'s turn`;
    const cssVar = getComputedStyle(document.documentElement).getPropertyValue(`--${p.var}`).trim();
    turnBadge.style.background = cssVar || 'transparent';
    // optionally show eliminated players in log
    const aliveNames = state.players.map((pl,i)=> state.alive[i] ? pl.name : `${pl.name} (out)`);
    // subtle display left in log only when helpful
    log(`Turn: ${p.name}. Players: ${aliveNames.join(', ')}`);
    // existing updateUI() code
    const p = state.players[state.turn];
    turnText.textContent = `${p.name}'s turn`;
    const cssVar = getComputedStyle(document.documentElement).getPropertyValue(`--${p.var}`).trim();
    turnBadge.style.background = cssVar || 'transparent';

    // NEW: tint the board background based on current player
    boardEl.style.backgroundColor = cssVar + "22"; // light opacity for overall board
    boardEl.style.transition = "background-color 0.5s ease";
    boardEl.style.backgroundColor = cssVar + "22";

  }

  function log(m){ logEl.textContent = m; }

  // Wire up buttons
  document.getElementById("newBtn").onclick = newGame;
  document.getElementById("resetBtn").onclick = resetGame;

  // Start first game
  // set default players dropdown to 2 if not set
  if(!document.getElementById("players").value) document.getElementById("players").value = "2";
  newGame();

})();
</script>
</body>
</html>
