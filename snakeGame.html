<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Snake Game</title>
<style>
:root{
  --bg:#000; --panel:#0b0d12; --text:#e9eef4; --muted:#99a3b2; --accent:#7dd3fc; --accent2:#c084fc;
  --swatchBorder:#2b2f3a; --btn:#1a2130; --btnHover:#212a3b; --error:#ff5d5d;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
canvas{display:block;background:#111}
.overlay{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(60% 60% at 50% 50%, rgba(14,18,27,.95), rgba(6,8,12,.98)); z-index:10;
}
.card{
  width:min(680px,92vw); border:1px solid #1f2536; border-radius:16px; padding:24px 20px;
  background:linear-gradient(180deg,#121826 0%, #0e1422 100%); box-shadow:0 18px 60px rgba(0,0,0,.55);
}
.title{font-size:28px;font-weight:800;letter-spacing:.4px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.field{flex:1 1 240px;display:flex;flex-direction:column;gap:8px}
label{font-size:13px;color:#cdd6e5}
input[type="text"]{
  height:38px;padding:0 12px;border-radius:10px;border:1px solid #263048;background:#0b1220;color:#eaf2ff;outline:none;
}
input[type="text"]::placeholder{color:#6f7a92}
.swatches{display:grid;grid-template-columns:repeat(8,32px);gap:10px;padding:4px}
.swatch{
  width:32px;height:32px;border-radius:8px;border:2px solid var(--swatchBorder);
  cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
}
.swatch.selected{outline:2px solid #fff;outline-offset:2px}
.customRow{display:flex;gap:10px;align-items:center;margin-top:10px}
.customRow input[type="color"]{
  width:42px;height:32px;border-radius:8px;border:2px solid var(--swatchBorder);background:#000;padding:0;appearance:none;cursor:pointer;
}
.preview{display:flex;align-items:center;gap:10px;margin-top:6px;color:#c8d2e6;font-size:13px}
.previewDot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
.btnRow{display:flex;gap:12px;justify-content:flex-end;margin-top:18px}
.btn{height:40px;padding:0 16px;border-radius:12px;border:1px solid #2a344b;background:var(--btn);color:#e9eef4;font-weight:700;cursor:pointer}
.btn:hover{background:var(--btnHover)}
.btn.primary{border-color:#2d3e65;background:linear-gradient(180deg,#1a2848,#111a33);color:#dbe7ff}
.btn.primary:hover{filter:brightness(1.05)}
.error{color:var(--error);font-size:13px;margin-top:8px;display:none}
@media (max-width:520px){.swatches{grid-template-columns:repeat(6,32px)}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>


<div class="overlay" id="homeOverlay" aria-modal="true" role="dialog">
  <div class="card">
    <h1 class="title">Snake — Enter the Arena</h1>
    <p class="sub">Choose your display name and snake color, then press <strong>Start</strong>.</p>


    <div class="row">
      <div class="field">
        <label for="playerName">Display Name</label>
        <input id="playerName" type="text" placeholder="e.g., Swift Viper" maxlength="24" />
        <div class="preview"><span class="previewDot" id="previewDot"></span><span id="previewText">Preview</span></div>
        <div class="error" id="nameErr">Please enter a name (1–24 characters).</div>
      </div>
    </div>


    <div class="row" style="margin-top:12px">
      <div class="field" style="flex:1 1 100%">
        <label>Pick a Color</label>
        <div class="swatches" id="swatchGrid"></div>
        <div class="customRow">
          <input type="color" id="customColor" value="#32cd32" title="Custom color" />
          <button class="btn" id="useCustom">Use Custom</button>
        </div>
      </div>
    </div>


    <div class="btnRow">
      <button class="btn" id="randomizeBtn">Randomize</button>
      <button class="btn primary" id="startBtn">Start</button>
    </div>
  </div>
</div>


<script>
// ======================= Config =======================
const CONFIG={
  zoomFactor:0.8,
  turn:{playerMax:2.8,aiMax:3.5,accel:18,gain:2.8,speedAccel:280},
  ai:{
    biggerStart:[200,360],
    bodyAvoidRadius:90,bodyDangerRadius:70,
    personalityTemplates:{
      fearful:{aggression:[0.05,0.25],dotSeekingWeight:[1.6,2.4],bodyAvoidRadius:[120,180],wallMargin:[180,240]},
      balanced:{aggression:[0.40,0.60],dotSeekingWeight:[1.0,1.4],bodyAvoidRadius:[95,130],wallMargin:[140,190]},
      aggressive:{aggression:[0.70,0.95],dotSeekingWeight:[0.7,1.1],bodyAvoidRadius:[75,100],wallMargin:[110,160]},
    }
  },
  minimap:{enabled:true,size:220,scale:0.07,gridStep:500},
  apples:{lifetime:20},
  boost:{depletionRate:20,speedFactor:2,minLengthFloor:80,overheatSeconds:1.9},
  width:{base:12,scale:1,max:100},
  spawn:{wallMargin:200,safeRadiusFromSnakes:300,maxAttempts:60}
};


// ======================= NET (local | client | p2p-host | p2p-peer) =================
const NET = (() => {
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || 'local';               // 'client' to use the server
  const addr = params.get('addr') || 'ws://localhost:8080'; // server address


  let ws=null;
  let joined=false;
  let joinQueue=null; // {name,color} to send when ws opens


  const NetState = { snakesById:new Map() };
  let myId = null;


  function connectWS(){
    return new Promise((resolve,reject)=>{
      const s = new WebSocket(addr);
      s.onopen = ()=>resolve(s);
      s.onerror = reject;
    });
  }


  function applySnapshot(S){
    const seen = new Set();
    for(const bs of S.snakes){
      let s = NetState.snakesById.get(bs.id);
      if(!s){ s = Object.assign(new Snake(bs.x,bs.y,bs.color,bs.isPlayer), bs); }
      // Copy fields
      s.x = bs.x; s.y = bs.y; s.angle = bs.angle; s.color = bs.color;
      s.name = bs.name; s.isPlayer = bs.isPlayer; s.alive = bs.alive;
      s.targetLength = bs.targetLength;
      // Deep copy path (avoid sharing array refs)
      s.path = (bs.path && bs.path.length) ? bs.path.map(p=>({x:p.x,y:p.y})) : [{x:bs.x,y:bs.y}];
      NetState.snakesById.set(bs.id, s);
      seen.add(bs.id);
    }
    for(const id of [...NetState.snakesById.keys()]) if(!seen.has(id)) NetState.snakesById.delete(id);


    snakes = [...NetState.snakesById.values()];
    // pick camera snake: prefer myId
    if(myId && NetState.snakesById.has(myId)) playerSnake = NetState.snakesById.get(myId);
    else playerSnake = snakes.find(s=>s.isPlayer) || snakes[0] || null;
  }


  async function initClient(){
    ws = await connectWS();


    // If user already pressed Start before WS opened, send the queued join now.
    if(joinQueue){ ws.send(JSON.stringify({type:'join', name:joinQueue.name, color:joinQueue.color})); joinQueue=null; }


    ws.onmessage = (ev)=>{
      try{
        const msg = JSON.parse(ev.data);
        if(msg.type === 'joined'){
          myId = msg.id; NET.__myId = msg.id; joined=true;
        }else if(msg.type === 'snapshot'){
          applySnapshot(msg.data);
        }
      }catch(_){}
    };
    ws.onclose = ()=>{ joined=false; myId=null; };
  }


  return {
    mode,
    __myId:null,
    isClient: ()=> mode==='client',
    async init(){ if(this.isClient()) await initClient(); },
    startJoin(name,color){
      if(!this.isClient()) return;
      if(ws && ws.readyState===1){
        ws.send(JSON.stringify({type:'join', name, color}));
      }else{
        // queue until WS opens
        joinQueue = {name,color};
      }
    },
    onFrameSendInput(mx,my,boost){
      if(!this.isClient()) return;
      if(!joined || !myId) return; // don't spam before acknowledged
      if(ws && ws.readyState===1){
        ws.send(JSON.stringify({type:'input', mx, my, boosting:!!boost}));
      }
    },
    leave(){
      if(!this.isClient()) return;
      if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'leave'}));
      joined=false;
    },
    get status(){ return {mode, joined, myId}; }
  };
})();


// ======================= Canvas / Map =======================
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener("resize",resize);resize();
const MAP_WIDTH=4000,MAP_HEIGHT=4000;
const colors=["lime","cyan","magenta","yellow","orange","purple","pink","teal","brown","deepskyblue","gold","white","violet"];
const zoomFactor=CONFIG.zoomFactor;


// ======================= Menu / UI State =======================
const overlay = document.getElementById('homeOverlay');
const nameInput = document.getElementById('playerName');
const startBtn = document.getElementById('startBtn');
const randomizeBtn = document.getElementById('randomizeBtn');
const swatchGrid = document.getElementById('swatchGrid');
const customColorInput = document.getElementById('customColor');
const useCustomBtn = document.getElementById('useCustom');
const nameErr = document.getElementById('nameErr');
const previewDot = document.getElementById('previewDot');
const previewText = document.getElementById('previewText');


let selectedColor='lime';
let gameStarted=false;
let rafId=null, idleRafId=null;


// Swatches / preview
function buildSwatches(){
  swatchGrid.innerHTML='';
  colors.forEach(c=>{
    const div=document.createElement('div');
    div.className='swatch';
    div.style.background=c; div.title=c;
    div.addEventListener('click',()=>{ selectedColor=c; updateSwatchSelection(); updatePreview(); });
    swatchGrid.appendChild(div);
  });
  updateSwatchSelection();
}
function updateSwatchSelection(){[...swatchGrid.children].forEach(el=>el.classList.toggle('selected', el.title===selectedColor));}
function updatePreview(){ previewDot.style.background=selectedColor; previewText.textContent=(nameInput.value||'Your Name')+' — '+selectedColor; }
useCustomBtn.addEventListener('click',()=>{ selectedColor = customColorInput.value || selectedColor; updateSwatchSelection(); updatePreview(); });


function generateRandomName(){
  const A=["Swift","Mighty","Sly","Brave","Fierce","Cunning","Slick","Wild","Bold","Rapid","Crimson","Emerald","Steel","Rogue","Prime","Ghost","Turbo","Quantum","Lunar","Arctic","Nova","Shadow","Thunder","Frost","Blaze","Venom","Zen","Echo","Flux","Vortex","Nebula","Cosmic","Neon","Mystic","Legendary","Epic","Celestial","Phantom","Wraith","Commander","General","Hunter","Assassin","Samurai","Knight","Mage","Ranger","Dragon","Phoenix","Titan"];
  const N=["Python","Viper","Cobra","Serpent","Adder","Anaconda","Mamba","Rattler","Boa","Sidewinder","Taipan","Krait","Asp","Cottonmouth","Coral","Fang","Hydra","Naga","Wyrm","Slither","Coil","Helix","Loop","Ring","Sine","Cosine","Tangent"];
  return `${A[Math.floor(Math.random()*A.length)]} ${N[Math.floor(Math.random()*N.length)]}`;
}
nameInput.value = generateRandomName(); buildSwatches(); updatePreview();


nameInput.addEventListener('input',()=>{ nameErr.style.display='none'; updatePreview(); });
randomizeBtn.addEventListener('click',()=>{ nameInput.value = generateRandomName(); updatePreview(); });
function validateName(){ const v=(nameInput.value||'').trim(); if(!v||v.length>24){ nameErr.style.display='block'; return null; } return v; }
startBtn.addEventListener('click', ()=>{
  const n=validateName(); if(!n) return;
  startGame(n, selectedColor);
});
window.addEventListener('keydown', e=>{
  if(overlay.style.display!=='none' && (e.key==='Enter'||e.key==='NumpadEnter')){
    const n=validateName(); if(!n) return; startGame(n, selectedColor);
  }
});


// ======================= Helpers =======================
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function angleDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b));}
function moveTowards(cur,tgt,md){return cur<tgt?Math.min(cur+md,tgt):Math.max(cur-md,tgt);}


// ======================= Entities =======================
let NEXT_ID=1;
function Snake(x,y,color,isPlayer=false){
  this.id=NEXT_ID++; this.x=x; this.y=y; this.path=[{x,y}];
  this.angle=Math.random()*Math.PI*2; this.angVel=0;
  this.maxTurnRate=isPlayer?CONFIG.turn.playerMax:CONFIG.turn.aiMax;
  this.turnAccel=CONFIG.turn.accel; this.turnGain=CONFIG.turn.gain;
  this.baseSpeed=150; this.curSpeed=this.baseSpeed;
  this.targetLength=200; this.color=color; this.isPlayer=isPlayer; this.alive=true;
  this.name=isPlayer?"Player":generateRandomName();
}
Snake.prototype.getThickness=function(){
  const t=CONFIG.width.base+Math.sqrt(this.targetLength)*CONFIG.width.scale;
  return Math.min(t,CONFIG.width.base+CONFIG.width.max);
};
Snake.prototype.getHeadRadius=function(){ return Math.max(7,this.getThickness()*0.5); };
Snake.prototype.getBodyRadius=function(){ return Math.max(6,this.getThickness()*0.5); };


// Draw body directly from path (no dependency on `sampled`)
Snake.prototype.drawBodyFromPath = function(ctx){
  const bodyR = this.getBodyRadius();
  const pts = this.path;
  if(!pts || pts.length<2) return;
  const step = Math.max(1, Math.floor(pts.length/28));
  for(let i=0;i<pts.length;i+=step){
    const p = pts[i];
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,bodyR,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=1.2; ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.stroke();
  }
};


Snake.prototype.draw = function(ctx){
  const headR=this.getHeadRadius(), bodyR=this.getBodyRadius();


  // body
  this.drawBodyFromPath(ctx);


  // neck join
  const nx=this.x-Math.cos(this.angle)*(bodyR*0.6);
  const ny=this.y-Math.sin(this.angle)*(bodyR*0.6);
  ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(nx,ny,bodyR*0.95,0,Math.PI*2); ctx.fill();


  // head (semi-circle)
  const start=this.angle-Math.PI/2,end=this.angle+Math.PI/2;
  ctx.save(); ctx.shadowColor=this.color; ctx.shadowBlur=headR*1.2; ctx.fillStyle=this.color;
  ctx.beginPath(); ctx.arc(this.x,this.y,headR,start,end,false);
  const ax=this.x+Math.cos(start)*headR, ay=this.y+Math.sin(start)*headR;
  ctx.lineTo(this.x,this.y); ctx.lineTo(ax,ay); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.lineWidth=1.4; ctx.strokeStyle="rgba(0,0,0,0.45)";
  ctx.beginPath(); ctx.arc(this.x,this.y,headR,start,end,false); ctx.stroke();


  // eyes
  const eyeSide=headR*0.45, eyeFwd=headR*0.25, perp=this.angle+Math.PI/2;
  const lX=this.x+Math.cos(perp)*eyeSide+Math.cos(this.angle)*eyeFwd;
  const lY=this.y+Math.sin(perp)*eyeSide+Math.sin(this.angle)*eyeFwd;
  const rX=this.x-Math.cos(perp)*eyeSide+Math.cos(this.angle)*eyeFwd;
  const rY=this.y-Math.sin(perp)*eyeSide+Math.sin(this.angle)*eyeFwd;
  const eyeR=Math.max(2,headR*0.18), pupilR=Math.max(1,eyeR*0.55), pupilFwd=headR*0.12;
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(lX,lY,eyeR,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(rX,rY,eyeR,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(lX+Math.cos(this.angle)*pupilFwd,lY+Math.sin(this.angle)*pupilFwd,pupilR,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(rX+Math.cos(this.angle)*pupilFwd,rY+Math.sin(this.angle)*pupilFwd,pupilR,0,Math.PI*2); ctx.fill();


  // name
  ctx.fillStyle="#fff"; ctx.font="12px system-ui, sans-serif";
  ctx.fillText(this.name, this.x-20, this.y-headR-8);
};


// ======================= World =======================
let snakes=[], apples=[], nowSec=0;
let playerSnake=null;
const numAISnakes=20; // local only


// ======================= Mouse =======================
const mouse={x:canvas.width/2,y:canvas.height/2,down:false};
canvas.addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
canvas.addEventListener("pointerdown",e=>{if(e.button===0)mouse.down=true;});
canvas.addEventListener("pointerup",e=>{if(e.button===0)mouse.down=false;});
canvas.addEventListener("contextmenu",e=>e.preventDefault());


// ======================= Apple (client local visuals only) =======================
function Apple(x,y){ this.x=x; this.y=y; this.radius=6; this.born=nowSec; }
Apple.prototype.draw=function(ctx){ ctx.fillStyle="red"; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); };


// ======================= Transform helpers =======================
function screenToWorld(sx,sy,center){return{x:center.x+(sx-canvas.width/2)/zoomFactor,y:center.y+(sy-canvas.height/2)/zoomFactor};}


// ======================= Start / Menu =======================
function startGame(playerName, playerColor){
  // Client mode: join server and start rendering snapshots
  if (NET.isClient()){
    NET.startJoin(playerName, playerColor);
    overlay.style.display='none';
    gameStarted=true;
    lastTime=performance.now();
    if(rafId) cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(gameLoop);
    return;
  }


  // Local sandbox (not used when `?mode=client`)
  overlay.style.display='none';
  gameStarted=true;
  snakes=[]; apples=[]; playerSnake=null; NEXT_ID=1;
  playerSnake = new Snake(MAP_WIDTH/2, MAP_HEIGHT/2, playerColor, true);
  playerSnake.name = playerName;
  snakes.push(playerSnake);
  for(let i=0;i<numAISnakes;i++){
    const s=new Snake(Math.random()*MAP_WIDTH,Math.random()*MAP_HEIGHT,colors[i%colors.length],false);
    s.targetLength=CONFIG.ai.biggerStart[0]+Math.random()*(CONFIG.ai.biggerStart[1]-CONFIG.ai.biggerStart[0]);
    snakes.push(s);
  }
  for(let i=0;i<60;i++) apples.push(new Apple(Math.random()*MAP_WIDTH,Math.random()*MAP_HEIGHT));
  lastTime=performance.now();
  rafId=requestAnimationFrame(gameLoop);
}


function returnToMenu(){
  NET.leave();
  gameStarted=false;
  if(rafId) cancelAnimationFrame(rafId), rafId=null;
  snakes=[]; apples=[]; playerSnake=null;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height);
  overlay.style.display='flex';
  drawIdle();
}


// Idle grid
function drawIdle(){
  if(gameStarted) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#121621"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#1d2740"; ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  idleRafId=requestAnimationFrame(drawIdle);
}


// ======================= Loop =======================
let lastTime=performance.now();
function gameLoop(ts){
  if(!gameStarted){ rafId=requestAnimationFrame(gameLoop); return; }


  // Clear
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);


  const dt=(ts-lastTime)/1000; lastTime=ts; nowSec=ts/1000;


  if (NET.isClient()){
    // No player snake yet? show status and wait for the next frame.
    const status = NET.status;
    if(!playerSnake){
      drawStatusHUD(status, "Waiting for snapshots…");
      rafId=requestAnimationFrame(gameLoop); return;
    }
    // If it's my snake and I'm dead -> menu
    if(status.myId && playerSnake.id===status.myId && playerSnake.alive===false){
      returnToMenu(); return;
    }
    // Send input only when joined and myId is known
    if(status.joined && status.myId && playerSnake){
      const m=screenToWorld(mouse.x,mouse.y,playerSnake);
      NET.onFrameSendInput(m.x, m.y, mouse.down);


      // client-side visual turn prediction (only rotates local sprite)
      const desired=Math.atan2(m.y-playerSnake.y,m.x-playerSnake.x);
      const d=angleDiff(desired,playerSnake.angle);
      playerSnake.angle += d * 0.8;
    }


    drawWorldAndHud(status);
    rafId=requestAnimationFrame(gameLoop);
    return;
  }


  // (local mode sim omitted for brevity)
  drawWorldAndHud({mode:'local', joined:true, myId:playerSnake?.id||null});
  rafId=requestAnimationFrame(gameLoop);
}


function drawWorldAndHud(status){
  if(!playerSnake){ drawStatusHUD(status, "No player snake yet…"); return; }


  // World (camera)
  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.scale(zoomFactor,zoomFactor);
  ctx.translate(-playerSnake.x,-playerSnake.y);


  // Map BG
  ctx.fillStyle="#222"; ctx.fillRect(0,0,MAP_WIDTH,MAP_HEIGHT);
  ctx.strokeStyle="#333"; ctx.lineWidth=1;
  for(let x=0;x<=MAP_WIDTH;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,MAP_HEIGHT);ctx.stroke();}
  for(let y=0;y<=MAP_HEIGHT;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(MAP_WIDTH,y);ctx.stroke();}


  // Apples (server apples are plain {x,y})
  for(const a of apples){ if(a.draw) a.draw(ctx); /* local only */ }


  // Snakes
  for(const s of snakes){ if(!s.alive) continue; s.draw && s.draw(ctx); }


  ctx.restore();


  // HUD (leaderboard + status)
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#fff"; ctx.font="14px system-ui, sans-serif";
  ctx.fillText("Leaderboard",10,20);
  const board=snakes.slice().filter(s=>s.alive).sort((a,b)=>b.targetLength-a.targetLength).slice(0,10);
  for(let i=0;i<board.length;i++){ const s=board[i]; ctx.fillText(`${i+1}. ${s.name} - ${Math.floor(s.targetLength)}`,10,40+i*18); }


  // connection/status HUD
  const modeTxt = `mode=${status.mode} | joined=${status.joined ? 'yes':'no'} | myId=${status.myId ?? '—'}`;
  ctx.fillText(modeTxt, 10, canvas.height-12);
  ctx.restore();


  // Minimap (simple, relative to player)
  if(CONFIG.minimap.enabled) drawMinimap();
}


function drawStatusHUD(status,msg){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#fff"; ctx.font="14px system-ui, sans-serif";
  ctx.fillText(msg, 10, 24);
  const modeTxt = `mode=${status.mode} | joined=${status.joined ? 'yes':'no'} | myId=${status.myId ?? '—'}`;
  ctx.fillText(modeTxt, 10, 44);
  ctx.restore();
}


function drawMinimap(){
  const size=CONFIG.minimap.size, pad=12, x0=canvas.width-size-pad, y0=pad, scale=CONFIG.minimap.scale;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(x0,y0,size,size);
  ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.strokeRect(x0,y0,size,size);
  const cx=x0+size/2, cy=y0+size/2;
  const w2m=(wx,wy)=>({x:cx+(wx-playerSnake.x)*scale, y:cy+(wy-playerSnake.y)*scale});
  // border
  ctx.strokeStyle="rgba(255,255,255,0.6)"; ctx.lineWidth=1.5;
  ctx.strokeRect(w2m(0,0).x, w2m(0,0).y, MAP_WIDTH*scale, MAP_HEIGHT*scale);
  // snakes
  ctx.fillStyle="#0ff";
  for(const s of snakes){
    if(!s.alive) continue;
    const step=Math.max(1,Math.floor((s.path?.length||0)/40));
    for(let i=0;i<(s.path?.length||0);i+=step){
      const seg=s.path[i]; const p=w2m(seg.x,seg.y);
      if(p.x<x0||p.x>x0+size||p.y<y0||p.y>y0+size) continue;
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}


// ======================= Boot =======================
window.addEventListener('load', async ()=>{
  overlay.style.display='flex';
  drawIdle();
  await NET.init(); // opens WS if ?mode=client
});
</script>
